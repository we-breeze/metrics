[package]
name = "brz-metrics"
version = "0.0.6"
edition = "2024"
description = "lightweight high-concurrency metric slot registry"
license = "Apache-2.0"
repository = "https://github.com/we-breeze/metrics"
readme = "README.md"
# `brz-metrics` owns one process-global registry. Keep Cargo from resolving
# multiple versions of this crate into the same final binary.
links = "brz_metrics_registry"
build = "build.rs"

[lib]
name = "brz_metrics"

[dependencies]
ahash = "0.8"
arc-swap = "1.9.2"
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "metrics"
harness = false
